[tool.poetry]
name = "giant-plugins"
version = "0.6.4"
description = "Adds a generic list of plugins for use within projects"
authors = ["Will-Hoey <will.hoey@giantmade.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/giantmade/giant-plugins"
repository = "https://github.com/giantmade/giant-plugins"
keywords = ["plugins", "app"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
include = [
    "LICENSE",
]
packages = [
    { include = "giant_plugins" }
]

[tool.poetry.dependencies]
python = "^3.12"
django-filer = "*"
giant-mixins = "*"

[tool.poetry.dev-dependencies]
pytest = "*"
black = "^19.10b0"
django-cms = "^3.11"
django = "^5.0"
pytest-cov = "*"
pytest-django = "*"
six = "*"
django-polymorphic = "*"

[[tool.poetry.source]]
name = "TestPyPi"
url = "https://test.pypi.org/simple/"
secondary = true

[tool.black]
line-length = 99
target-version = ['py36']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.ipython
  | \.mypy_cache
  | \.ropeproject
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"